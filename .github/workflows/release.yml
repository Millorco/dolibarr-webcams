# Quando pubblichi una release su GitHub, allega lo zip del modulo.
name: Zip del modulo
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: gh release upload "${{ github.event.release.tag_name }}" module_webcams-*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
